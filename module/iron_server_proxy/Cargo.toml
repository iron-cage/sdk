[package]
name = "iron_server_proxy"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
name = "iron_server_proxy"
path = "src/lib.rs"

[[bin]]
name = "iron_server_proxy"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["full"]
enabled = [
  "dep:iron_llm_core",
  "dep:iron_token_manager",
  "dep:iron_secrets",
  "dep:iron_cost",
  "dep:axum",
  "dep:reqwest",
  "dep:tokio",
  "dep:serde_json",
  "dep:sqlx",
  "dep:dotenvy",
  "dep:sha2",
  "dep:base64",
  "dep:secrecy",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:zeroize",
  "dep:futures-util",
  "dep:lru",
]
full = ["enabled"]

[dependencies]
iron_llm_core = { workspace = true, optional = true, features = ["enabled"] }
iron_token_manager = { workspace = true, optional = true }
iron_secrets = { workspace = true, optional = true }
iron_cost = { workspace = true, optional = true, features = ["enabled"] }

axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
tokio = { workspace = true, optional = true, features = ["full"] }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter"] }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
# Enable loopback URL bypass in iron_llm_core so wiremock URLs pass SSRF validation in tests.
iron_llm_core = { workspace = true, features = ["enabled", "allow-insecure-base-urls"] }
sha2 = { workspace = true }
