[package]
name = "iron_secrets"
version = "0.3.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Secrets management and encryption for Iron Cage"
repository = "https://github.com/.../iron_runtime"
readme = "readme.md"
keywords = ["secrets", "encryption", "key-management", "security"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["full"]
enabled = [
  "dep:iron_runtime_state",
  "dep:aes-gcm",
  "dep:argon2",
  "dep:rand",
  "dep:zeroize",
  "dep:secrecy",
  "dep:base64",
  "dep:sqlx",
  "dep:tokio",
  "dep:serde",
  "dep:tracing",
  "dep:mod_interface",
]
full = ["enabled"]

[dependencies]
# Workspace crates (feature-gated)
iron_runtime_state = { workspace = true, optional = true }

# Crypto
aes-gcm = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Database
sqlx = { workspace = true, optional = true }

# Async
tokio = { workspace = true, optional = true }

# Serialization
serde = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

# Modularity
mod_interface = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
