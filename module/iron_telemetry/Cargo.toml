[package]
name = "iron_telemetry"
version= "0.4.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Logging and tracing infrastructure for Iron Cage AI agent management"
repository = "https://github.com/.../iron_cage"
readme = "readme.md"
keywords = ["ai", "agent", "logging", "tracing", "telemetry"]
categories = ["development-tools", "development-tools::debugging"]

[lints]
workspace = true

[features]
default = ["enabled"]
enabled = [
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:serde",
]
full = ["enabled"]

[dependencies]
iron_types = { workspace = true, optional = true, features = ["full"] }

# Logging and tracing
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter", "json"] }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
