[package]
name = "iron_llm_core"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Shared LLM routing core: provider detection, request/response translation, and forwarding"
repository = "https://github.com/.../iron_cage"
keywords = ["llm", "proxy", "openai", "anthropic", "routing"]
categories = ["web-programming::http-client"]

[lints]
workspace = true

[features]
default = ["enabled"]
enabled = [
  "dep:iron_cost",
  "dep:iron_secrets",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde",
  "dep:serde_json",
  "dep:tracing",
]

[dependencies]
iron_cost = { workspace = true, optional = true, features = ["enabled"] }
iron_secrets = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true, features = ["json"] }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
iron_cost = { workspace = true, features = ["enabled"] }
