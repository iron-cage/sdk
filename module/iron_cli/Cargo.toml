[package]
name = "iron_cli"
version = "0.4.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Command-line interface for Iron Cage agent management"
repository = "https://github.com/.../iron_runtime"
readme = "readme.md"
keywords = ["cli", "agent", "management", "command-line"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[features]
default = ["full"]
enabled = [
  "dep:tokio",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_yaml",
  "dep:reqwest",
  "dep:unilang",
  "dep:async-trait",
  "dep:dirs",
  "dep:keyring",
]
full = ["enabled"]
# test-adapter: Enables InMemoryAdapter for integration tests
# (compile_error! prevents production use)
test-adapter = []

[dependencies]
# Core dependencies
iron_config_loader = { workspace = true }
tokio = { workspace = true, optional = true, features = ["full"] }
reqwest = { workspace = true, optional = true, features = ["json", "query"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
unilang = { workspace = true, optional = true, features = ["default"] }
async-trait = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
regex = { workspace = true }
base64 = { workspace = true }
tree_fmt = { workspace = true, features = ["table_plain", "expanded_postgres", "format_json", "format_yaml"] }
sqlx = { workspace = true, optional = true }

[build-dependencies]
serde_yaml = { workspace = true }

[dev-dependencies]
# Test dependencies automatically enable test-adapter feature
iron_cli = { path = ".", features = ["test-adapter"] }
iron_test_db = { path = "../iron_test_db" }

# Test infrastructure dependencies (real implementations, no mocking)
axum = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio-rustls"] }
criterion = { workspace = true, features = ["html_reports"] }

[[bin]]
name = "iron-token"
path = "src/bin/iron_token_unilang.rs"

[[bin]]
name = "iron"
path = "src/bin/iron_control_unilang.rs"

[[bench]]
name = "formatting_benchmarks"
harness = false
