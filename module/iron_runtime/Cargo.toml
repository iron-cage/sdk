[package]
name = "iron_runtime"
version = "0.4.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Agent runtime with LLM request routing and translation"
repository = "https://github.com/.../iron_runtime"
readme = "readme.md"
keywords = ["runtime", "llm", "routing", "agent-runtime"]
categories = ["asynchronous"]

[lints]
workspace = true

[features]
default = ["full"]
enabled = [
  "dep:iron_types",
  "dep:iron_runtime_state",
  "dep:iron_telemetry",
  "dep:iron_safety",
  "dep:iron_cost",
  "dep:iron_reliability",
  "dep:iron_secrets",
  "dep:zeroize",
  "dep:secrecy",
  "dep:hex",
  "dep:tokio",
  "dep:serde",
  "dep:serde_json",
  "dep:uuid",
  "dep:anyhow",
  # LlmRouter dependencies
  "dep:axum",
  "dep:reqwest",
  "dep:tracing",
]
analytics = ["dep:iron_runtime_analytics"]
full = ["enabled", "analytics"]

[dependencies]
# Iron Cage crates
iron_types = { workspace = true, optional = true, features = ["full"] }
iron_runtime_state = { workspace = true, optional = true, features = ["enabled", "sqlite"] }
iron_telemetry = { workspace = true, optional = true, features = ["full"] }
iron_safety = { workspace = true, optional = true, features = ["full"] }
iron_cost = { workspace = true, optional = true, features = ["full"] }
iron_reliability = { workspace = true, optional = true, features = ["full"] }
iron_secrets = { workspace = true, optional = true }
iron_runtime_analytics = { workspace = true, optional = true, features = ["full"] }

# Note: PyO3 moved to iron_sdk (ADR-010)

# Async runtime
tokio = { workspace = true, optional = true, features = ["full"] }

# Serialization
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }

# Error handling
anyhow = { workspace = true, optional = true }


# Utilities
uuid = { workspace = true, optional = true, features = ["v4"] }

# HTTP server (LlmRouter)
axum = { workspace = true, optional = true }

# HTTP client (LlmRouter)
reqwest = { workspace = true, optional = true, features = ["json", "blocking"] }

# Hex decoding (IP_TOKEN_KEY env var)
hex = { workspace = true, optional = true }

# Memory-safe secret zeroing (IP Token decryption)
zeroize = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# Enable test utilities for ID types in tests
iron_types = { workspace = true, features = ["test-helpers"] }
# KeyFetcher integration tests — encrypt tokens for mock server responses
iron_secrets = { workspace = true }

[lib]
name = "iron_runtime"
# Pure Rust library (PyO3 moved to iron_sdk per ADR-010)
crate-type = ["rlib"]
