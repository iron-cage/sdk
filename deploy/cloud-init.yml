#cloud-config

package_update: true
package_upgrade: true

packages:
  - htop
  - curl
  - ca-certificates
  - gnupg
  - openssl
  - fail2ban

ssh_pwauth: false

users:
  - name: root
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD: ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}


write_files:
  # -----------------------------------------------------------------------------------
  # SSH hardening
  - path: /etc/ssh/sshd_config.d/99-no-password.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password

  # -----------------------------------------------------------------------------------
  # Bootstrap script
  - path: /root/init.sh
    permissions: "0700"
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive

      echo "=============================="
      echo "[BOOTSTRAP] starting setup..."
      echo "=============================="

      # ==================================================================================
      # Fail2ban
      systemctl enable fail2ban || true

      cat > /etc/fail2ban/jail.local <<'JAIL'
      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      logpath  = /var/log/auth.log
      maxretry = 5
      bantime  = 3600
      findtime = 600
      JAIL

      systemctl restart fail2ban || true


      # ==================================================================================
      # Install k3s (only if missing)
      if ! command -v k3s >/dev/null 2>&1; then
        echo "[INFO] Installing k3s..."
        curl -sfL https://get.k3s.io | sh -
      else
        echo "[INFO] k3s already installed"
      fi

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      mkdir -p /root/.kube
      ln -sf /etc/rancher/k3s/k3s.yaml /root/.kube/config
      chmod 600 /etc/rancher/k3s/k3s.yaml


      # ==================================================================================
      # Wait cluster
      echo "[INFO] Waiting Kubernetes API..."
      until kubectl version >/dev/null 2>&1; do sleep 2; done

      echo "[INFO] Waiting nodes registration..."
      until [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ]; do sleep 2; done

      kubectl wait --for=condition=Ready node --all --timeout=300s

      echo "[SUCCESS] k3s ready"


      # ==================================================================================
      # Install Helm
      if ! command -v helm >/dev/null 2>&1; then
        echo "[INFO] Installing helm..."
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      else
        echo "[INFO] helm already installed"
      fi


      # ==================================================================================
      # Logging stack (modern charts, not deprecated loki-stack)
      echo "[INFO] Installing Loki + Promtail + Grafana..."

      helm repo add grafana https://grafana.github.io/helm-charts >/dev/null 2>&1 || true
      helm repo update

      # ---------- Loki ----------
      helm upgrade --install loki grafana/loki \
        --namespace logging \
        --create-namespace \
        --wait \
        --set deploymentMode=SingleBinary \
        --set loki.storage.type=filesystem \
        --set loki.storage.filesystem.directory=/var/loki \
        --set persistence.enabled=true \
        --set persistence.size=40Gi \
        --set limits_config.retention_period=168h

      # ---------- Promtail ----------
      helm upgrade --install promtail grafana/promtail \
        --namespace logging \
        --wait

      # ---------- Grafana ----------
      # password auto-generated by chart (stored only in k8s secret)
      helm upgrade --install grafana grafana/grafana \
        --namespace logging \
        --wait \
        --set persistence.enabled=true \
        --set persistence.size=5Gi \
        --set datasources."datasources\.yaml".apiVersion=1 \
        --set datasources."datasources\.yaml".datasources[0].name=Loki \
        --set datasources."datasources\.yaml".datasources[0].type=loki \
        --set datasources."datasources\.yaml".datasources[0].url=http://loki:3100 \
        --set datasources."datasources\.yaml".datasources[0].access=proxy \
        --set datasources."datasources\.yaml".datasources[0].isDefault=true

      echo ""
      echo "=========================================="
      echo "Cluster ready!"
      echo ""
      echo "Grafana access:"
      echo "kubectl port-forward -n logging svc/grafana 3000:80"
      echo ""
      echo "Get password anytime:"
      echo "kubectl get secret -n logging grafana -o jsonpath=\"{.data.admin-password}\" | base64 -d ; echo"
      echo "=========================================="

runcmd:
  - /root/init.sh > /var/log/server-init.log 2>&1
