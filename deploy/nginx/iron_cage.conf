# Iron Cage Nginx configuration

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name internal.ironcage.local; # Update with actual domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name internal.ironcage.local; # Update with actual domain

    ssl_certificate /etc/nginx/ssl/ironcage.crt;
    ssl_certificate_key /etc/nginx/ssl/ironcage.key;

    # TLS hardening (Mozilla modern profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    client_max_body_size 10M;

    # Forward to Control API (Management)
    # Handles: user/RBAC management, provider key CRUD, agent management, IC Token generation
    # Agents use LlmRouter(server_url=...) which points here for initial setup.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward to Server Proxy (LLM Traffic)
    # Handles: IC Token auth, provider key decryption, LLM request forwarding, cost tracking
    # Agents send OpenAI-format requests to /proxy/v1/chat/completions (the /proxy/ prefix
    # is stripped by proxy_pass, so the server proxy sees /v1/chat/completions).
    # Supports Anthropic, OpenAI, Gemini, and xAI providers via auto-detection and translation.
    location /proxy/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for LLM streaming responses (SSE)
        proxy_buffering off;

        # Long timeouts for LLM streaming responses (model inference can take minutes)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
    }
}
