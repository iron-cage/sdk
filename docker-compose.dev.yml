version: '3.8'

services:
  # Frontend container
  frontend:
    image: ${TAG}_front
    container_name: ${PROJECT_NAME}_front
    ports:
      - "${PROJECT_PORT_FRONT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    image: ${TAG}_back
    container_name: ${PROJECT_NAME}_back
    environment:
      DATABASE_URL: sqlite:///app/data/iron.db?mode=rwc
      JWT_SECRET: ${JWT_SECRET}
      IRON_SECRETS_MASTER_KEY: ${IRON_SECRETS_MASTER_KEY}
      IP_TOKEN_KEY: ${IP_TOKEN_KEY}
      IC_TOKEN_SECRET: ${IC_TOKEN_SECRET}
      SERVER_PORT: ${PROJECT_PORT_BACK}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      IRON_DEPLOYMENT_MODE: ${IRON_DEPLOYMENT_MODE}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED}
      RUST_LOG: info
    ports:
    - "${PROJECT_PORT_BACK}:${PROJECT_PORT_BACK}"
    volumes:
      - sqlite_data:/app/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PROJECT_PORT_BACK}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  gateway:
    external: true
volumes:
  sqlite_data:
    driver: local
